# Live model refresh: every morning, pull real New England weather, ISO-NE load / fuel mix /
# day-ahead prices and Henry Hub / oil prices, re-solve the model for the past 7 and next 7 days,
# score yesterday's forecasts, and commit the results. The app's Live tab reads them.
name: Live model daily refresh

on:
  schedule:
    - cron: "23 11 * * *"     # 6:23 am EST / 7:23 am EDT, before the day-ahead market posts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-live.txt
      - name: Pull live data
        run: python -m negem.live_data --strict
      - name: Re-solve the model on live inputs
        run: python -m negem.live
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live results/live
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Live model refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

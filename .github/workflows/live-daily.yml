# Live model refresh: every morning, pull real New England weather, ISO-NE load / fuel mix /
# day-ahead prices and Henry Hub / oil prices, re-solve the model for the past 7 and next 7 days,
# score yesterday's forecasts, and commit the results. The app's Live tab reads them.
name: Live model daily refresh

on:
  schedule:
    # ISO-NE posts next-day day-ahead prices around 1:30 pm Eastern, and GitHub often starts
    # scheduled jobs hours late. Two runs make sure a forecast is in before the market posts;
    # the track record keeps the first forecast made each day.
    - cron: "13 5 * * *"      # 12:13 am EST / 1:13 am EDT
    - cron: "23 11 * * *"     # 6:23 am EST / 7:23 am EDT (backup and refresh)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        # --prefer-binary: if a brand-new release has no prebuilt wheel yet (lxml 6.2.0 on
        # 2026-11-27), use the previous version's wheel instead of trying to compile it.
        # The loop retries a brief PyPI hiccup before giving up.
        run: |
          for i in 1 2 3; do
            pip install --prefer-binary --retries 5 --timeout 60 \
              -r requirements.txt -r requirements-live.txt && exit 0
            echo "pip install failed (attempt $i), retrying in 30s"; sleep 30
          done
          exit 1
      - name: Pull live data
        run: python -m negem.live_data --strict
      - name: Re-solve the model on live inputs
        run: python -m negem.live
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live results/live
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Live model refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
